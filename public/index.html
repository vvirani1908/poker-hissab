<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Hissab</title>
<script>
  (function () { try { var t = localStorage.getItem('theme'); if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
  :root { color-scheme:dark; --bg:#0f1a14; --card:#17261d; --line:#254033; --text:#e8f1ec; --mute:#8fa89a; --accent:#f2c14e; --on-accent:#1b1500; --win:#4ade80; --loss:#f87171;
          --inset:#0f1a14; --panel:#12201a; --warn-bg:#3a2a0a; --win-bg:#12331f; --loss-bg:#3a1717; --even-bg:#222; --gold:#6b5513; --axis:#4d6b5b; --line-strong:#2f5442;
          --live-bg:#2a1a1a; --live-line:#7f3a3a; --accent-soft:#1e1a0a; --shadow:rgba(0,0,0,.45);
          --pod1:linear-gradient(180deg,#6b5513,#3b3010); --pod2:linear-gradient(180deg,#4a5057,#2c3135); --pod3:linear-gradient(180deg,#6a4220,#3a2512); }
  :root[data-theme=light] { color-scheme:light; --bg:#f4f1ea; --card:#ffffff; --line:#e2dccd; --text:#1d2a22; --mute:#5f6d64; --accent:#b9770e; --on-accent:#ffffff; --win:#15803d; --loss:#c0392b;
          --inset:#efeadc; --panel:#f8f5ee; --warn-bg:#fff3d1; --win-bg:#dcfce7; --loss-bg:#fee2e2; --even-bg:#e5e7eb; --gold:#e3c466; --axis:#a8b3a8; --line-strong:#cfc7b2;
          --live-bg:#fdebe8; --live-line:#e9b4ae; --accent-soft:#fdf3d4; --shadow:rgba(60,50,20,.18);
          --pod1:linear-gradient(180deg,#f3d98a,#e0b84c); --pod2:linear-gradient(180deg,#dde2e6,#bcc4cc); --pod3:linear-gradient(180deg,#ecc7a0,#d39d68); }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; margin:0; cursor:pointer; } header h1 span { color:var(--accent); }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:16px; } h3 { margin:0 0 8px; font-size:14px; color:var(--mute); font-weight:600; }

  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  input, select { background:var(--inset); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; width:100%; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }

  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }

  .stat { background:var(--inset); border-radius:10px; padding:12px; } .stat b { display:block; font-size:22px; } .stat small { color:var(--mute); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); } th:first-child,td:first-child { text-align:left; } th { color:var(--mute); font-weight:600; font-size:13px; }
  .win { color:var(--win); } .loss { color:var(--loss); } .mute { color:var(--mute); }
  .code { font:700 22px ui-monospace,monospace; letter-spacing:3px; color:var(--accent); background:var(--inset); padding:6px 12px; border-radius:8px; }
  .lobby-item { display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }

  .login { max-width:360px; margin:8vh auto 0; } .login input { margin-bottom:10px; }
  input[type=checkbox] { width:auto; vertical-align:middle; margin-right:6px; }
  td input { text-align:right; padding:6px; min-width:70px; }

  .pill { display:inline-block; background:var(--inset); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:12px; color:var(--mute); }
  .live { border-color:var(--live-line); background:linear-gradient(180deg,var(--live-bg) 0%,var(--card) 60%); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--loss); margin-right:8px; box-shadow:0 0 0 0 rgba(248,113,113,.7); animation:pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 10px rgba(248,113,113,0); } 100% { box-shadow:0 0 0 0 rgba(248,113,113,0); } }
  .ev { border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; background:var(--panel); }
  .ev h3 { color:var(--text); font-size:16px; margin:0 0 2px; } .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }

  nav#nav { display:flex; gap:6px; max-width:860px; margin:0 auto; padding:10px 16px 0; }

  nav#nav a.on { background:var(--accent); color:var(--on-accent); } nav#nav a:not(.on):hover { border-color:var(--line); color:var(--text); }
  .podium { display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:6px 0 18px; }

  .pod .base { border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-size:26px; }

  .avatar { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; background:linear-gradient(135deg,var(--accent),#c98a1c); color:var(--on-accent); flex:none; }
  .formdots { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .fd { min-width:54px; text-align:center; padding:5px 8px; border-radius:8px; font-size:13px; font-weight:700; }
  .fd.w { background:var(--win-bg); color:var(--win); } .fd.l { background:var(--loss-bg); color:var(--loss); } .fd.p { background:var(--even-bg); color:var(--mute); }
  .badges { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .badge { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
  .badge .ic { font-size:26px; } .badge small { color:var(--mute); display:block; font-size:12px; } .badge.off { opacity:.4; filter:grayscale(1); } .badge.on { border-color:var(--gold); }
  .insight { padding:10px 12px; border-left:3px solid var(--accent); background:var(--panel); border-radius:0 10px 10px 0; margin-bottom:8px; font-size:14px; }
  .bar { height:8px; border-radius:4px; background:var(--inset); overflow:hidden; min-width:60px; } .bar i { display:block; height:100%; }
  .empty { text-align:center; padding:26px 12px; color:var(--mute); }
  .owe { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); margin-bottom:8px; flex-wrap:wrap; }
  .owe.me { border-color:var(--gold); } .owe .arrow { color:var(--accent); font-weight:700; } .owe .amt { margin-left:auto; font-weight:700; font-size:16px; }
  .owe .names { flex:1 1 180px; min-width:0; word-break:break-word; }
  .summary { padding:12px 14px; border-radius:12px; margin-bottom:12px; font-weight:600; background:var(--inset); border:1px solid var(--line); }
  /* ---------- landing ---------- */
  .landing > header, .landing > nav#nav { display:none; }
  .landing main { max-width:1100px; padding-top:0; }
  .lp-top { display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
  .lp-logo { font-size:20px; font-weight:700; } .lp-logo span { color:var(--accent); }
  .lp-hero { display:grid; grid-template-columns:1.15fr .85fr; gap:36px; align-items:center; padding:20px 0 40px; }
  .lp-eyebrow { display:inline-block; padding:5px 12px; border:1px solid var(--gold); border-radius:999px; color:var(--accent); font-size:13px; font-weight:600; background:var(--accent-soft); }
  .lp-hero h1 { font-size:clamp(34px,5.2vw,56px); line-height:1.04; letter-spacing:-1.5px; margin:16px 0 14px; }
  .lp-hero h1 em { font-style:normal; background:linear-gradient(90deg,var(--accent),#ff9f5a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lp-sub { color:var(--mute); font-size:17px; max-width:520px; margin:0 0 22px; }
  .lp-cta { display:flex; gap:10px; flex-wrap:wrap; } .lp-cta button { padding:12px 22px; font-size:16px; }
  .lp-trust { display:flex; gap:18px; flex-wrap:wrap; margin-top:22px; color:var(--mute); font-size:13px; } .lp-trust b { color:var(--text); }
  .lp-stage { position:relative; height:200px; margin-top:26px; max-width:520px; }
  .pcard { position:absolute; width:104px; height:148px; border-radius:12px; background:#f7f3e8; color:#1a1a1a; box-shadow:0 14px 30px rgba(0,0,0,.45); display:flex; flex-direction:column; justify-content:space-between; padding:8px 10px; font-weight:800; font-size:22px; line-height:1; animation:floaty 6s ease-in-out infinite; }
  .pcard.r { color:#c8312f; } .pcard i { font-style:normal; font-size:46px; align-self:center; } .pcard b { align-self:flex-end; transform:rotate(180deg); }
  .pcard.c1 { left:10px; top:34px; transform:rotate(-14deg); } .pcard.c2 { left:96px; top:14px; transform:rotate(-2deg); animation-delay:-2s; } .pcard.c3 { left:182px; top:30px; transform:rotate(11deg); animation-delay:-4s; }
  .pchip { position:absolute; width:58px; height:58px; border-radius:50%; border:5px dashed rgba(255,255,255,.85); box-shadow:inset 0 0 0 5px rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.4); animation:floaty 5s ease-in-out infinite; }
  .pchip.a { background:#c8312f; left:318px; top:96px; } .pchip.b { background:#1f6f43; left:366px; top:58px; animation-delay:-1.5s; } .pchip.c { background:#2a3f9c; left:340px; top:132px; animation-delay:-3s; }
  @keyframes floaty { 50% { translate:0 -9px; } }
  .lp-section { padding:34px 0; } .lp-section > h2 { font-size:clamp(24px,3.4vw,34px); letter-spacing:-.6px; margin:0 0 6px; text-align:center; }
  .lp-section > p.lead { text-align:center; color:var(--mute); margin:0 auto 26px; max-width:560px; }
  .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; counter-reset:st; }
  .step { position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 18px 18px; counter-increment:st; }
  .step::before { content:counter(st); position:absolute; top:-14px; left:16px; width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--on-accent); font-weight:800; display:flex; align-items:center; justify-content:center; }
  .step b { display:block; margin-bottom:4px; font-size:16px; } .step span { color:var(--mute); font-size:14px; }
  .feats { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .feat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; transition:transform .2s, border-color .2s; } .feat:hover { transform:translateY(-3px); border-color:var(--gold); }
  .feat .ic { font-size:28px; display:block; margin-bottom:8px; } .feat b { display:block; margin-bottom:4px; } .feat span { color:var(--mute); font-size:14px; }
  .lp-preview { display:grid; grid-template-columns:1fr 1fr; gap:26px; align-items:center; background:linear-gradient(135deg,var(--card),var(--panel)); border:1px solid var(--line); border-radius:22px; padding:28px; }
  .mock { background:var(--inset); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 18px 40px rgba(0,0,0,.4); }
  .mock .big { font-size:34px; font-weight:800; color:var(--win); letter-spacing:-1px; }
  .lp-foot { text-align:center; color:var(--mute); font-size:13px; padding:30px 0 40px; border-top:1px solid var(--line); margin-top:30px; }
  @media (max-width:860px) { .lp-hero { grid-template-columns:1fr; padding-top:6px; } .lp-preview { grid-template-columns:1fr; padding:20px; } }
  @media (prefers-reduced-motion:reduce) { .pcard, .pchip { animation:none; } .feat { transition:none; } }
  .lp-art { position:relative; height:300px; display:flex; align-items:center; justify-content:flex-end; overflow:visible; }
  .lp-art .lp-stage { margin:0; transform:scale(1.12); transform-origin:right center; width:430px; max-width:100%; height:200px; }
  .lp-top .btns { display:flex; gap:8px; }
  .modal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(5,10,8,.72); backdrop-filter:blur(5px); animation:fadein .15s ease-out; overflow-y:auto; }
  .modal-card { position:relative; width:100%; max-width:420px; background:var(--card); border:1px solid var(--line-strong); border-radius:18px; padding:26px 24px 22px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:popin .2s ease-out; margin:auto; }
  .modal-card h2 { font-size:22px; margin:0 0 4px; } .modal-card .sub { color:var(--mute); font-size:14px; margin-bottom:16px; }
  .modal-card input:not([type=checkbox]) { margin-bottom:10px; }
  .modal-x { position:absolute; top:10px; right:10px; width:32px; height:32px; padding:0; border-radius:50%; background:transparent; color:var(--mute); border:1px solid var(--line); font-size:18px; line-height:1; }
  .modal-x:hover { color:var(--text); border-color:var(--mute); }
  @keyframes fadein { from { opacity:0; } } @keyframes popin { from { opacity:0; transform:translateY(10px) scale(.97); } }
  body.modal-open { overflow:hidden; }
  @media (max-width:860px) { .lp-art { display:none; } }
  @media (prefers-reduced-motion:reduce) { .modal, .modal-card { animation:none; } }
  #toasts { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; width:min(92vw,420px); pointer-events:none; }
  .toast { pointer-events:auto; display:flex; gap:10px; align-items:center; background:var(--card); color:var(--text); border:1px solid var(--line-strong); border-left:4px solid var(--win); border-radius:12px; padding:10px 14px; box-shadow:0 10px 30px var(--shadow); font-size:14px; animation:popin .2s ease-out; width:100%; }
  .toast.err { border-left-color:var(--loss); } .toast button { margin-left:auto; }
  .dlg-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  .dlg-field { margin-bottom:10px; } .dlg-field label { display:block; font-size:12px; color:var(--mute); margin-bottom:4px; }
  #dlg { z-index:80; }
  .recap .winner { display:flex; align-items:center; gap:10px; padding:12px 14px; margin:12px 0; border-radius:14px; background:var(--accent-soft); border:1px solid var(--gold); font-size:18px; }
  .rrow { display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
  .rrow .rk { color:var(--mute); font-weight:700; } .rrow .bar { margin-top:5px; } .rrow b.amt { font-size:16px; }
  #recap { z-index:60; }
  details summary { cursor:pointer; padding:8px 0; }
</style>

<body>
<header><h1 onclick="location.hash='#/'">♠ Poker <span>Hissab</span></h1><div class="row" style="gap:8px;flex-wrap:nowrap"><button class="ghost sm" id="themeBtn" aria-label="Toggle light or dark theme" title="Toggle theme"></button><div id="who"></div></div></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let token = localStorage.getItem('token'), me = null, D = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n * 100) / 100).toLocaleString('en-US');
const signed = n => `<span class="${n > 0 ? 'win' : n < 0 ? 'loss' : 'mute'}">${n > 0 ? '+' : ''}${money(n)}</span>`;
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });


// ---------- theme ----------
function applyThemeBtn() { const b = document.getElementById('themeBtn'); if (b) b.textContent = document.documentElement.dataset.theme === 'light' ? '🌙' : '☀️'; document.querySelectorAll('.themeSw').forEach(x => x.textContent = document.documentElement.dataset.theme === 'light' ? '🌙' : '☀️'); }
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {}
  applyThemeBtn();
}
document.addEventListener('click', e => { if (e.target.id === 'themeBtn' || e.target.classList.contains('themeSw')) toggleTheme(); });

// ---------- toasts & dialogs (replace the browser's alert / confirm / prompt) ----------
function toast(msg, kind, action) {
  let box = document.getElementById('toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast' + (kind === 'err' ? ' err' : ''); t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement('button'); b.className = 'sm'; b.textContent = action.label; b.onclick = () => { t.remove(); action.fn(); }; t.appendChild(b); }
  box.appendChild(t); setTimeout(() => t.remove(), action ? 9000 : (kind === 'err' ? 5000 : 3200));
}
// fields: [{id,label,type,value,placeholder,min,help}] -> resolves to {id: value} or null when cancelled
function openDialog({ title, text, fields = [], ok = 'OK', cancel = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const m = document.createElement('div'); m.id = 'dlg'; m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<form class="modal-card" style="max-width:400px"><h2>${esc(title)}</h2>${text ? `<div class="sub" style="margin-bottom:12px">${text}</div>` : ''}
      ${fields.map(f => `<div class="dlg-field"><label for="df-${f.id}">${esc(f.label)}</label><input id="df-${f.id}" type="${f.type || 'text'}" ${f.min !== undefined ? `min="${f.min}"` : ''} step="any" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" autocomplete="off">${f.help ? `<div class="mute" style="font-size:12px;margin-top:3px">${esc(f.help)}</div>` : ''}</div>`).join('')}
      <p class="err" id="dlg-err"></p>
      <div class="dlg-actions">${cancel ? `<button type="button" class="ghost" id="dlg-cancel">${esc(cancel)}</button>` : ''}<button type="submit" class="${danger ? 'danger' : ''}" id="dlg-ok">${esc(ok)}</button></div></form>`;
    const close = v => { document.removeEventListener('keydown', keys); m.remove(); if (!document.getElementById('authModal')) document.body.classList.remove('modal-open'); resolve(v); };
    const keys = e => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } };
    document.addEventListener('keydown', keys); document.body.appendChild(m); document.body.classList.add('modal-open');
    m.addEventListener('mousedown', e => { if (e.target === m) close(null); });
    if (cancel) m.querySelector('#dlg-cancel').onclick = () => close(null);
    m.querySelector('form').onsubmit = e => { e.preventDefault(); const vals = {}; fields.forEach(f => vals[f.id] = m.querySelector('#df-' + f.id).value); close(vals); };
    (m.querySelector('input') || m.querySelector('#dlg-ok')).focus();
  });
}

// ---------- chart: cumulative profit/loss by night ----------
function chartSVG(history) {
  if (!history.length) return '<p class="mute" style="text-align:center">Your chart appears after your first game.</p>';
  const W = 640, H = 230, L = 52, R = 14, T = 14, B = 28;
  const pts = [{ date: null, v: 0 }, ...history.map(h => ({ date: h.date, v: h.cumulative, net: h.net }))];
  let lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(0, ...pts.map(p => p.v));
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const last = pts[pts.length - 1].v, col = last >= 0 ? 'var(--win)' : 'var(--loss)';
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const ticks = [lo + pad, 0, hi - pad].filter((v, i, a) => a.indexOf(v) === i);
  const step = Math.ceil(pts.length / 6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative profit and loss by game night">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? 'var(--axis)' : 'var(--line)'}" ${t === 0 ? '' : 'stroke-dasharray="3 4"'}/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${money(Math.round(t))}</text>`).join('')}
    <path d="${area}" fill="${col}" opacity=".13"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => i ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="${col}" stroke="var(--card)" stroke-width="2"><title>${fmtDate(p.date)}: ${p.net > 0 ? '+' : ''}${money(p.net)} (total ${money(p.v)})</title></circle>` : '').join('')}
    ${pts.map((p, i) => i && (i - 1) % step === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${new Date(p.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>` : '').join('')}
  </svg>`;
}

// ---------- bar chart: result of each night ----------
function barsSVG(history) {
  if (!history.length) return '';
  const W = 640, H = 170, L = 52, R = 14, T = 12, B = 26;
  const vals = history.map(h => h.net);
  let hi = Math.max(0, ...vals), lo = Math.min(0, ...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const slot = (W - L - R) / history.length, bw = Math.min(46, slot * 0.66);
  const step = Math.ceil(history.length / 7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Result of each night">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>
    <text x="${L - 8}" y="${y(hi) + 4}" text-anchor="end">${money(Math.round(hi))}</text><text x="${L - 8}" y="${y(lo) + 4}" text-anchor="end">${money(Math.round(lo))}</text>
    ${history.map((h, i) => { const x = L + slot * i + (slot - bw) / 2, y0 = y(0), y1 = y(h.net);
      return `<rect x="${x.toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, Math.abs(y1 - y0)).toFixed(1)}" rx="3" fill="${h.net >= 0 ? 'var(--win)' : 'var(--loss)'}" opacity=".9"><title>${fmtDate(h.date)}: ${h.net > 0 ? '+' : ''}${money(h.net)}</title></rect>`
        + (i % step === 0 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${new Date(h.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>` : ''); }).join('')}
  </svg>`;
}


// ---------- seasons (calendar quarters) and rivalries, computed from every night ----------
const seasonKey = d => { const [y, m] = d.split('-').map(Number); return `${y}-Q${Math.ceil(m / 3)}`; };

  D.nights.forEach(n => { if (scope !== 'all' && seasonKey(n.date) !== scope) return; n.entries.forEach(e => { const t = map[e.userId]; if (!t) return; t.games++; if (e.net > 0) t.wins++; t.net += e.net; t.buyIn += e.buyIn; t.cashOut += e.cashOut; }); });
  let arr = Object.values(map); if (scope !== 'all') arr = arr.filter(p => p.games > 0);

const signedText = n => (n > 0 ? '+' : n < 0 ? '-' : '') + money(Math.abs(n));
function rivalries() {
  const my = D.user.id, map = {}, ids = new Set(D.members.map(m => m.id));

// ---------- settle-up: who owes whom ----------
function oweRow(t, sup) {
  const meIn = t.from === D.user.id || t.to === D.user.id;
  const who = t.from === D.user.id ? '<b>You</b>' : esc(t.fromName), whom = t.to === D.user.id ? '<b>you</b>' : esc(t.toName);
  return `<div class="owe ${meIn ? 'me' : ''}"><div class="names">${who} <span class="arrow">owes</span> ${whom}</div><span class="amt">${money(t.amount)}</span>
    ${sup ? `<button class="ghost sm" onclick="markPaid('${t.from}','${t.to}',${t.amount})">Mark paid</button>` : ''}</div>`;
}
function oweSummary() {
  const mine = D.owe.settlements, owes = mine.filter(t => t.from === D.user.id).reduce((a, t) => a + t.amount, 0), owed = mine.filter(t => t.to === D.user.id).reduce((a, t) => a + t.amount, 0);
  if (owes > 0 && owed > 0) return `<div class="summary">You owe <span class="loss">${money(owes)}</span> and you're owed <span class="win">${money(owed)}</span>.</div>`;
  if (owes > 0) return `<div class="summary">You owe <span class="loss">${money(owes)}</span> in total.</div>`;
  if (owed > 0) return `<div class="summary">You're owed <span class="win">${money(owed)}</span> in total.</div>`;
  return D.highlights.games ? `<div class="summary win">✓ You're all square. Nobody owes you and you owe nobody.</div>` : '';
}
function oweCard(full) {
  const O = D.owe, sup = D.isSuper, list = full ? O.settlements : O.settlements.filter(t => t.from === D.user.id || t.to === D.user.id);
  return `<div class="card"><h2>💸 ${full ? 'Who owes whom' : 'Your settle-up'}</h2>
    <div class="mute" style="font-size:13px;margin:-6px 0 12px">The fewest payments that square everyone up, based on every recorded night${O.payments.length ? ' and the payments already made' : ''}.</div>
    ${oweSummary()}
    ${list.length ? list.map(t => oweRow(t, sup)).join('') : `<p class="mute">${D.highlights.games ? (full ? 'Everyone is settled up. 🎉' : 'Nothing to settle.') : 'Nothing to settle yet. Balances appear after the first recorded night.'}</p>`}
    ${Math.abs(O.unaccounted) > 0.009 ? `<div class="warn">Recorded cash-outs and buy-ins differ by ${money(Math.abs(O.unaccounted))}, so some money isn't accounted for in the games.</div>` : ''}
    ${full && O.payments.length ? `<details style="margin-top:10px"><summary class="mute">Recent payments (${O.payments.length})</summary>
      ${O.payments.map(p => `<div class="owe" style="margin:6px 0"><div class="names">${esc(p.fromName)} <span class="arrow">paid</span> ${esc(p.toName)} <span class="mute">· ${fmtDate(p.date)}</span></div><span class="amt">${money(p.amount)}</span>
        ${sup ? `<button class="ghost sm" onclick="undoPayment('${p.id}')">Undo</button>` : ''}</div>`).join('')}</details>` : ''}</div>`;
}
async function markPaid(from, to, amount) {
  const n = await askNumber('Mark as paid', 'Amount that was paid ($)', amount, { ok: 'Mark paid', help: 'Change it if only part was paid.' });
  if (n === null) return;
  try { await api('POST', '/api/payments', { from, to, amount: n }); toast('Payment recorded ✓'); route(); } catch (e) { toast(e.message, 'err'); }
}
async function undoPayment(id) { if (await askConfirm('Undo this payment?', { ok: 'Undo it' })) { await api('DELETE', '/api/payments/' + id); toast('Payment undone'); route(); } }

function portfolioPage() {

  const wins = hist.filter(h => h.net > 0), losses = hist.filter(h => h.net < 0);
  const winRate = n ? Math.round(100 * wins.length / n) : 0;

  const avg = n ? m.net / n : 0;
  const avgWin = wins.length ? wins.reduce((a, h) => a + h.net, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a, h) => a + h.net, 0) / losses.length : 0;
  // streaks
  let longestWin = 0, run = 0;
  hist.forEach(h => { run = h.net > 0 ? run + 1 : 0; longestWin = Math.max(longestWin, run); });

        <div class="mute">${n ? `Rank <b style="color:var(--text)">#${rank}</b> of ${D.standings.length} in ${esc(D.lobby.name)}` : esc(D.lobby.name)}</div></div></div>
      <div class="hero" style="margin-top:6px"><small>Overall earnings</small><div class="big">${signed(m.net)}</div>

      ${n ? `<div style="margin-top:12px"><div class="mute" style="font-size:12px;margin-bottom:6px">LAST ${form.length} NIGHT${form.length === 1 ? '' : 'S'}</div><div class="formdots">${form.map(h => `<span class="fd ${h.net > 0 ? 'w' : h.net < 0 ? 'l' : 'p'}" title="${fmtDate(h.date)}">${h.net > 0 ? '+' : ''}${money(h.net)}</span>`).join('')}</div></div>` : ''}</div>

    const bad = missing.filter(([k]) => !f[k] || (k === 'minBuyIn' && !(+f[k] > 0)));
    if (bad.length) { bad.forEach(([, id]) => $('#' + id).style.borderColor = 'var(--loss)'); $('#eerr').textContent = 'Please add ' + bad.map(b => b[2]).join(', ') + '.'; $('#' + bad[0][1]).focus(); return; }
    if (f.date < new Date().toISOString().slice(0, 10)) { $('#edate').style.borderColor = 'var(--loss)'; $('#eerr').textContent = 'The date can\'t be in the past.'; return; }
    try { await api('POST', '/api/events', f); location.hash = '#/'; } catch (e) { $('#eerr').textContent = e.message; }
  };
  sessionForm(null);
}

function sessionForm(s) {
  const rows = D.members.map(m => {
    const e = s ? s.entries.find(x => x.userId === m.id) : null;
    return `<tr data-u="${m.id}"><td><input type="checkbox" class="pl" ${!s || e ? 'checked' : ''}> ${esc(m.name)}</td>
      <td><input type="number" min="0" step="any" class="bi" value="${e ? e.buyIn : ''}" placeholder="0"></td>
      <td><input type="number" min="0" step="any" class="co" value="${e ? e.cashOut : ''}" placeholder="0"></td><td class="net">—</td></tr>`;
  }).join('');
  $('#formTitle').textContent = s ? 'Edit game' : 'Record a poker night';
  $('#sform').innerHTML = `
    <div class="row" style="margin-bottom:10px"><input type="date" id="sdate" value="${s ? s.date : new Date().toISOString().slice(0, 10)}" style="max-width:170px"><input id="snote" placeholder="Note (optional)" value="${s ? esc(s.note) : ''}"></div>
    <table><tr><th>Player</th><th>Start (in)</th><th>End (out)</th><th>Net</th></tr>${rows}
      <tr><td><b>Total</b></td><td id="tin">—</td><td id="tout">—</td><td id="tnet">—</td></tr></table>
    <div id="chk"></div>
    <div class="row" style="margin-top:12px"><button id="ssave">${s ? 'Save changes' : 'Save game'}</button>${s ? '<button class="ghost" id="scancel">Cancel</button>' : ''}</div><p class="err" id="err"></p>`;
  const calc = () => {
    let ti = 0, to = 0;
    document.querySelectorAll('#sform tr[data-u]').forEach(tr => {
      const on = tr.querySelector('.pl').checked;
      const bi = +tr.querySelector('.bi').value || 0, co = +tr.querySelector('.co').value || 0;
      tr.querySelector('.net').innerHTML = on ? signed(co - bi) : '—';
      if (on) { ti += bi; to += co; }
    });
    $('#tin').textContent = money(ti); $('#tout').textContent = money(to); $('#tnet').innerHTML = signed(to - ti);
    $('#chk').innerHTML = Math.abs(ti - to) > 0.001 ? `<div class="warn">Total in and out differ by ${money(Math.abs(ti - to))} — ${to > ti ? 'cash-outs exceed buy-ins' : 'some chips unaccounted for'}.</div>` : (ti ? '<div class="win" style="margin-top:8px">✓ Balanced</div>' : '');
  };
  $('#sform').oninput = calc; $('#sform').onchange = calc; calc();
  if (s) $('#scancel').onclick = () => sessionForm(null);
  $('#ssave').onclick = async () => {
    const entries = [...document.querySelectorAll('#sform tr[data-u]')].filter(tr => tr.querySelector('.pl').checked)
      .map(tr => ({ userId: tr.dataset.u, buyIn: +tr.querySelector('.bi').value || 0, cashOut: +tr.querySelector('.co').value || 0 }));
    if (!entries.length) return setErr('Select at least one player');
    try {
      const body = { date: $('#sdate').value, note: $('#snote').value, entries };
      if (s) await api('PUT', '/api/sessions/' + s.id, body); else await api('POST', '/api/sessions', body);
      dashboard();
    } catch (e) { setErr(e.message); }
  };
}

const waOpen = text => window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');

function calEvent(id) {
  const e = D.events.find(x => x.id === id);
  const pad = n => String(n).padStart(2, '0'), fmt = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const start = new Date(`${e.date}T${e.time || '19:00'}:00`), end = new Date(start.getTime() + 4 * 36e5);
  const esc2 = t => String(t || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Poker Hissab//EN', 'BEGIN:VEVENT', `UID:${e.id}@poker-hissab`, `DTSTAMP:${fmt(new Date())}`,
    `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`, `SUMMARY:${esc2('🃏 ' + e.title)}`, `LOCATION:${esc2(e.location)}`,
    `DESCRIPTION:${esc2(`Minimum buy-in ${money(e.minBuyIn)}. Join and track the night: ${location.origin}`)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:Poker night soon', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'poker-night.ics'; a.click();
  toast('Calendar file downloaded. Open it to add the event.');
}

  box.innerHTML = `<div class="warn" style="margin-top:12px"><b>End session</b> — enter what each player cashed out with.</div>
    <table><tr><th>Player</th><th>Total in</th><th>Cash-out</th><th>Net</th></tr>
    ${e.players.map(p => `<tr data-u="${p.userId}" data-in="${p.total}"><td>${esc(p.name)}</td><td>${money(p.total)}</td><td><input type="number" min="0" step="any" class="co" placeholder="0" value="${p.cashOut !== null ? p.cashOut : ''}"></td><td class="net">—</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td>${money(e.pot)}</td><td id="so-${id}">—</td><td></td></tr></table><div id="sc-${id}"></div>
    <div class="row" style="margin-top:10px"><button id="sf-${id}">Save &amp; end session</button><button class="ghost" onclick="$('#settle-${id}').innerHTML=''">Cancel</button></div>`;
  const calc = () => {
    let out = 0;
    box.querySelectorAll('tr[data-u]').forEach(tr => { const c = +tr.querySelector('.co').value || 0; out += c; tr.querySelector('.net').innerHTML = signed(c - +tr.dataset.in); });
    $('#so-' + id).textContent = money(out);
    $('#sc-' + id).innerHTML = Math.abs(out - e.pot) > 0.001 ? `<div class="warn">Cash-outs differ from the pot by ${money(Math.abs(out - e.pot))}.</div>` : '<div class="win" style="margin-top:8px">✓ Balanced</div>';
  };
  box.oninput = calc; calc();
  $('#sf-' + id).onclick = async () => {
    const cashOuts = {}; box.querySelectorAll('tr[data-u]').forEach(tr => cashOuts[tr.dataset.u] = +tr.querySelector('.co').value || 0);
    try { const fin = await api('POST', `/api/events/${id}/finish`, { cashOuts }); await route(); toast('Session saved to history ✓'); setTimeout(() => openRecap(fin.sessionId, true), 350); } catch (x) { $('#se-' + id).textContent = x.message; }
  };
}

// ---------- confetti ----------
function confetti(count = 140) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'), dpr = devicePixelRatio || 1;
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120';
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; document.body.appendChild(c);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#f2c14e', '#4ade80', '#f87171', '#ffffff', '#7dd3fc', '#c084fc', '#fb923c'];
  const ps = Array.from({ length: count }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight * .38, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, g: .32 + Math.random() * .2, s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .45, col: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    const age = t - t0; g.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .992; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - age / 3200); g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); g.restore(); });
    if (age < 3200) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
function celebrateTop() {
  if (!D || !D.nights.length) return;
  const top = standingsFor('all')[0]; if (!top || top.net <= 0) return;
  const key = 'ph_top_' + D.lobby.id; let prev = null; try { prev = localStorage.getItem(key); localStorage.setItem(key, top.id); } catch {}
  if (top.id === D.user.id && prev !== D.user.id) setTimeout(() => { confetti(170); toast("👑 You're #1 on the leaderboard!"); }, 700);
}

// ---------- night recap: a card to look at, share and save ----------
function recapText(n) {
  const sorted = [...n.entries].sort((a, b) => b.net - a.net), win = sorted[0];
  return `🃏 ${D.lobby.name} · ${fmtDate(n.date)}${n.note ? ' (' + n.note + ')' : ''}\n${win && win.net > 0 ? `🏆 Winner: ${win.name} ${signedText(win.net)}\n` : ''}\n${sorted.map((e, i) => `${i + 1}. ${e.name}  ${signedText(e.net)}`).join('\n')}\n\nPot ${money(n.pot)} · ${n.entries.length} players\n${location.origin}`;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function recapCanvas(n) {
  const sorted = [...n.entries].sort((a, b) => b.net - a.net), W = 1080, rowH = 104, H = Math.max(1350, 700 + sorted.length * rowH + 190);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const FONT = '-apple-system, "Segoe UI", system-ui, Roboto, sans-serif', GOLD = '#f2c14e', WIN = '#4ade80', LOSS = '#f87171', MUTE = '#8fa89a';
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0f1a14'); bg.addColorStop(1, '#17301f'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(242,193,78,.07)'; g.font = `bold 520px ${FONT}`; g.fillText('♠', W - 470, 560);
  g.strokeStyle = '#2f5442'; g.lineWidth = 3; rr(g, 40, 40, W - 80, H - 80, 36); g.stroke();
  g.fillStyle = GOLD; g.font = `bold 46px ${FONT}`; g.fillText('♠ Poker Hissab', 96, 142);
  g.fillStyle = MUTE; g.font = `600 28px ${FONT}`; g.fillText((D.lobby.name || '').toUpperCase().slice(0, 34) + '  ·  NIGHT RECAP', 96, 198);
  g.fillStyle = '#e8f1ec'; g.font = `bold 74px ${FONT}`; g.fillText(fmtDate(n.date), 96, 300);
  if (n.note) { g.fillStyle = MUTE; g.font = `32px ${FONT}`; g.fillText(n.note.slice(0, 50), 96, 352); }
  const win = sorted[0];
  if (win && win.net > 0) {
    g.fillStyle = 'rgba(242,193,78,.13)'; rr(g, 96, 400, W - 192, 190, 28); g.fill(); g.strokeStyle = '#6b5513'; g.lineWidth = 2; g.stroke();
    g.fillStyle = GOLD; g.font = `bold 28px ${FONT}`; g.fillText('🏆  WINNER OF THE NIGHT', 134, 458);
    g.fillStyle = '#ffffff'; g.font = `bold 72px ${FONT}`; g.fillText(win.name.slice(0, 16), 134, 546);
    g.fillStyle = WIN; g.font = `bold 72px ${FONT}`; g.textAlign = 'right'; g.fillText(signedText(win.net), W - 134, 546); g.textAlign = 'left';
  }
  const max = Math.max(1, ...sorted.map(e => Math.abs(e.net))); let y = 690;
  sorted.forEach((e, i) => {
    g.fillStyle = MUTE; g.font = `bold 38px ${FONT}`; g.fillText(String(i + 1), 100, y + 40);
    g.fillStyle = '#e8f1ec'; g.font = `600 42px ${FONT}`; g.fillText(e.name.slice(0, 18), 160, y + 40);
    g.fillStyle = e.net >= 0 ? WIN : LOSS; g.font = `bold 44px ${FONT}`; g.textAlign = 'right'; g.fillText(signedText(e.net), W - 100, y + 40); g.textAlign = 'left';
    g.fillStyle = 'rgba(255,255,255,.07)'; rr(g, 160, y + 58, W - 320, 12, 6); g.fill();
    g.fillStyle = e.net >= 0 ? WIN : LOSS; rr(g, 160, y + 58, Math.max(12, (W - 320) * Math.abs(e.net) / max), 12, 6); g.fill();
    y += rowH;
  });
  g.fillStyle = MUTE; g.font = `30px ${FONT}`; g.fillText(`Pot ${money(n.pot)}  ·  ${n.entries.length} players`, 100, H - 120);
  g.textAlign = 'right'; g.fillText(location.host, W - 100, H - 120); g.textAlign = 'left';
  return c;
}
async function shareRecapImage(n) {
  const blob = await new Promise(r => recapCanvas(n).toBlob(r, 'image/png')), name = `poker-recap-${n.date}.png`;
  const file = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: `${D.lobby.name} recap` }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); toast('Recap image saved ✓');
}
function openRecap(id, celebrate) {
  const n = D.nights.find(x => x.id === id); if (!n) return toast('Recap not found', 'err');
  const sorted = [...n.entries].sort((a, b) => b.net - a.net), win = sorted[0], max = Math.max(1, ...sorted.map(e => Math.abs(e.net)));
  document.getElementById('recap')?.remove();
  const m = document.createElement('div'); m.id = 'recap'; m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<div class="modal-card" style="max-width:470px"><button class="modal-x" id="rx" aria-label="Close">✕</button>
    <div class="recap"><div class="mute" style="font-size:12px;letter-spacing:1px">NIGHT RECAP · ${esc(D.lobby.name).toUpperCase()}</div>
      <h2 style="font-size:26px;margin:4px 0 0">${fmtDate(n.date)}</h2>${n.note ? `<div class="mute">${esc(n.note)}</div>` : ''}
      ${win && win.net > 0 ? `<div class="winner">🏆 <b>${esc(win.name)}</b> <span class="win" style="margin-left:auto;font-weight:800">${signedText(win.net)}</span></div>` : ''}
      <div class="grid" style="grid-template-columns:repeat(3,1fr);margin:10px 0"><div class="stat"><small>Pot</small><b style="font-size:18px">${money(n.pot)}</b></div><div class="stat"><small>Players</small><b style="font-size:18px">${n.entries.length}</b></div><div class="stat"><small>Biggest swing</small><b style="font-size:18px">${money(Math.max(...sorted.map(e => Math.abs(e.net))))}</b></div></div>
      ${sorted.map((e, i) => `<div class="rrow"><span class="rk">${i + 1}</span><div>${esc(e.name)}${e.userId === D.user.id ? ' <span class="mute">(you)</span>' : ''}<div class="bar"><i style="width:${Math.max(4, 100 * Math.abs(e.net) / max)}%;background:${e.net >= 0 ? 'var(--win)' : 'var(--loss)'}"></i></div></div><b class="amt ${e.net > 0 ? 'win' : e.net < 0 ? 'loss' : 'mute'}">${signedText(e.net)}</b></div>`).join('')}</div>
    <div class="dlg-actions" style="justify-content:flex-start"><button id="rwa">💬 WhatsApp</button><button class="ghost" id="rimg">🖼 Share image</button></div></div>`;
  document.body.appendChild(m); document.body.classList.add('modal-open');
  const close = () => { document.removeEventListener('keydown', keys); m.remove(); if (!document.querySelector('.modal')) document.body.classList.remove('modal-open'); };
  const keys = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', keys); m.addEventListener('mousedown', e => { if (e.target === m) close(); });
  m.querySelector('#rx').onclick = close; m.querySelector('#rwa').onclick = () => waOpen(recapText(n)); m.querySelector('#rimg').onclick = () => shareRecapImage(n);
  if (celebrate || (win && win.userId === D.user.id && win.net > 0)) setTimeout(() => confetti(win && win.userId === D.user.id ? 180 : 110), 250);
}

// ---------- live updates: a tiny "did anything change?" check, fast while a game is live ----------
let lastRev = null, liveNow = false, pollT = null;
const schedulePoll = () => { clearTimeout(pollT); pollT = setTimeout(pollTick, liveNow ? 4000 : 30000); };
async function pollTick() {
  if (!token || !me || document.hidden) return schedulePoll();
  try { const p = await api('GET', '/api/pulse'); liveNow = p.live; if (lastRev !== null && p.rev !== lastRev) await onRemoteChange(); lastRev = p.rev; } catch {}
  schedulePoll();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(pollT); pollTick(); } });
async function onRemoteChange() {
  const a = document.activeElement;
  if (document.querySelector('.modal')) return;
  const prev = D, nd = await api('GET', '/api/home');
  if (JSON.stringify(nd) === JSON.stringify(prev)) return;
  D = nd;
  if (nd.isSuper && (nd.pending || []).length > ((prev.pending || []).length)) { const who = nd.pending.find(p => !(prev.pending || []).some(q => q.id === p.id)); toast(`${who ? who.name : 'Someone'} wants to join your lobby`, 'ok', { label: 'Review', fn: () => { location.hash = '#/manage'; } }); }
  renderNav();
  if (currentPage() === 'manage') { const pb = document.getElementById('pendingBox'); if (pb) pb.innerHTML = pendingHTML(); return; }   // never disturb the host's forms
  if ((a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) || document.querySelector('[id^="settle-"] table')) return;
  const hadLive = prev.events.some(e => e.status === 'live'), hasLive = nd.events.some(e => e.status === 'live');
  const known = new Set(prev.nights.map(n => n.id)), fresh = nd.nights.find(n => !known.has(n.id));
  renderPage();
  if (hadLive && !hasLive && fresh) {
    const mine = fresh.entries.find(e => e.userId === D.user.id);
    if (mine && mine.net > 0) confetti(150);
    toast(mine ? `The session ended. You ${mine.net > 0 ? 'won' : mine.net < 0 ? 'lost' : 'broke even'}${mine.net ? ' ' + money(Math.abs(mine.net)) : ''}.` : 'The session ended.', 'ok', { label: 'View recap', fn: () => openRecap(fresh.id) });
  }
}
schedulePoll();

route();
</script>
