<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Hissab</title>
<style>
  :root { --bg:#0f1a14; --card:#17261d; --line:#254033; --text:#e8f1ec; --mute:#8fa89a; --accent:#f2c14e; --win:#4ade80; --loss:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; margin:0; cursor:pointer; } header h1 span { color:var(--accent); }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:16px; } h3 { margin:0 0 8px; font-size:14px; color:var(--mute); font-weight:600; }
  input, select { background:#0f1a14; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; width:100%; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { background:var(--accent); color:#1b1500; border:0; border-radius:8px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--loss); border:1px solid var(--loss); }
  button.sm { padding:4px 9px; font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .row > input { flex:1; min-width:120px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:#0f1a14; border-radius:10px; padding:12px; } .stat b { display:block; font-size:22px; } .stat small { color:var(--mute); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); } th:first-child,td:first-child { text-align:left; } th { color:var(--mute); font-weight:600; font-size:13px; }
  .win { color:var(--win); } .loss { color:var(--loss); } .mute { color:var(--mute); }
  .code { font:700 22px ui-monospace,monospace; letter-spacing:3px; color:var(--accent); background:#0f1a14; padding:6px 12px; border-radius:8px; }
  .lobby-item { display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .lobby-item:hover { border-color:var(--accent); }
  .err { color:var(--loss); min-height:1.2em; margin:8px 0 0; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { background:transparent; color:var(--mute); border:1px solid var(--line); } .tabs button.on { background:var(--accent); color:#1b1500; }
  .login { max-width:360px; margin:8vh auto 0; } .login input { margin-bottom:10px; }
  input[type=checkbox] { width:auto; vertical-align:middle; margin-right:6px; }
  td input { text-align:right; padding:6px; min-width:70px; }
  .warn { background:#3a2a0a; border:1px solid var(--accent); border-radius:8px; padding:8px 10px; margin-top:10px; font-size:13px; }
  .hero { text-align:center; padding:8px 0 4px; } .hero .big { font-size:44px; font-weight:700; letter-spacing:-1px; } .hero small { color:var(--mute); }
  .chart { width:100%; height:auto; display:block; margin-top:8px; } .chart text { fill:var(--mute); font-size:11px; }
  .pill { display:inline-block; background:#0f1a14; border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:12px; color:var(--mute); }
  .live { border-color:#7f3a3a; background:linear-gradient(180deg,#2a1a1a 0%,var(--card) 60%); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--loss); margin-right:8px; box-shadow:0 0 0 0 rgba(248,113,113,.7); animation:pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 10px rgba(248,113,113,0); } 100% { box-shadow:0 0 0 0 rgba(248,113,113,0); } }
  .ev { border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; background:#12201a; }
  .ev h3 { color:var(--text); font-size:16px; margin:0 0 2px; } .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .chip { background:#0f1a14; border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:13px; }
  .tag { color:var(--accent); font-weight:600; }
  nav#nav { display:flex; gap:6px; max-width:860px; margin:0 auto; padding:10px 16px 0; }
  nav#nav a { padding:8px 16px; border-radius:999px; color:var(--mute); text-decoration:none; font-weight:600; font-size:14px; border:1px solid transparent; }
  nav#nav a.on { background:var(--accent); color:#1b1500; } nav#nav a:not(.on):hover { border-color:var(--line); color:var(--text); }
  .podium { display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:6px 0 18px; }
  .pod { flex:1; max-width:190px; text-align:center; } .pod .who { font-weight:600; margin-bottom:2px; word-break:break-word; } .pod .amt { font-size:15px; margin-bottom:6px; }
  .pod .base { border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-size:26px; }
  .pod.p1 .base { height:112px; background:linear-gradient(180deg,#6b5513,#3b3010); } .pod.p2 .base { height:84px; background:linear-gradient(180deg,#4a5057,#2c3135); } .pod.p3 .base { height:62px; background:linear-gradient(180deg,#6a4220,#3a2512); }
  .avatar { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; background:linear-gradient(135deg,var(--accent),#c98a1c); color:#1b1500; flex:none; }
  .formdots { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .fd { min-width:54px; text-align:center; padding:5px 8px; border-radius:8px; font-size:13px; font-weight:700; }
  .fd.w { background:#12331f; color:var(--win); } .fd.l { background:#3a1717; color:var(--loss); } .fd.p { background:#222; color:var(--mute); }
  .badges { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .badge { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#12201a; }
  .badge .ic { font-size:26px; } .badge small { color:var(--mute); display:block; font-size:12px; } .badge.off { opacity:.4; filter:grayscale(1); } .badge.on { border-color:#6b5513; }
  .insight { padding:10px 12px; border-left:3px solid var(--accent); background:#12201a; border-radius:0 10px 10px 0; margin-bottom:8px; font-size:14px; }
  .bar { height:8px; border-radius:4px; background:#0f1a14; overflow:hidden; min-width:60px; } .bar i { display:block; height:100%; }
  .empty { text-align:center; padding:26px 12px; color:var(--mute); }
  .owe { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#12201a; margin-bottom:8px; flex-wrap:wrap; }
  .owe.me { border-color:#6b5513; } .owe .arrow { color:var(--accent); font-weight:700; } .owe .amt { margin-left:auto; font-weight:700; font-size:16px; }
  .owe .names { flex:1 1 180px; min-width:0; word-break:break-word; }
  .summary { padding:12px 14px; border-radius:12px; margin-bottom:12px; font-weight:600; background:#0f1a14; border:1px solid var(--line); }
  details summary { cursor:pointer; padding:8px 0; }
</style>
</head>
<body>
<header><h1 onclick="location.hash='#/'">♠ Poker <span>Hissab</span></h1><div id="who"></div></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let token = localStorage.getItem('token'), me = null, D = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n * 100) / 100).toLocaleString('en-US');
const signed = n => `<span class="${n > 0 ? 'win' : n < 0 ? 'loss' : 'mute'}">${n > 0 ? '+' : ''}${money(n)}</span>`;
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && token) logoutLocal(); throw new Error(j.error || 'Request failed'); }
  return j;
}
function logoutLocal() { token = null; me = null; localStorage.removeItem('token'); route(); }
async function logout() { try { await api('POST', '/api/logout'); } catch {} logoutLocal(); }
const setErr = m => { const e = $('#err'); if (e) e.textContent = m || ''; };

async function route() {
  if (token && !me) { try { me = (await api('GET', '/api/me')).user; } catch { token = null; } }
  $('#who').innerHTML = me ? `${esc(me.name)} ${me.role === 'super' ? '<span class="pill">super user</span>' : ''} <button class="ghost sm" onclick="logout()">Log out</button>` : '';
  if (!me) { $('#nav').innerHTML = ''; return loginView(); }
  const h = location.hash;
  const page = h.startsWith('#/portfolio') ? 'portfolio' : (h.startsWith('#/manage') && me.role === 'super') ? 'manage' : 'home';
  $('#nav').innerHTML = [['home', '#/', 'Home'], ['portfolio', '#/portfolio', 'My Portfolio'], ...(me.role === 'super' ? [['manage', '#/manage', 'Manage']] : [])]
    .map(([k, href, label]) => `<a href="${href}" class="${k === page ? 'on' : ''}">${label}</a>`).join('');
  try { D = await api('GET', '/api/home'); } catch (e) { app.innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
  window.scrollTo(0, 0);
  return { home: homePage, portfolio: portfolioPage, manage: managePage }[page]();
}
const dashboard = () => route();
window.addEventListener('hashchange', route);

// ---------- sign in / create account ----------
async function loginView(mode = 'login') {
  const reg = mode === 'register';
  const st = reg ? await api('GET', '/api/status') : null;
  app.innerHTML = `<div class="card login">
    <h2 style="text-align:center;font-size:20px">${reg ? 'Create account' : 'Sign in'}</h2>
    ${reg ? `<input id="name" placeholder="Your name">` : ''}
    <input id="user" placeholder="Username" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="${reg ? 'new-password' : 'current-password'}">
    <label class="mute" style="display:block;margin:-2px 0 12px;font-size:13px"><input type="checkbox" id="showpw"> Show password</label>
    ${reg ? (st.hasLobby
      ? `<input id="code" placeholder="Lobby code (from the super user)" style="text-transform:uppercase" autocapitalize="characters" autocomplete="off">`
      : `<div class="warn" style="margin:0 0 10px">You're the first one here, so you'll be the <b>super user</b> and set up the lobby.</div><input id="lobbyName" placeholder="Lobby name (e.g. Friday Night Poker)">`) : ''}
    <button style="width:100%" id="go">${reg ? 'Create account' : 'Sign in'}</button><p class="err" id="err"></p>
    <p class="mute" style="text-align:center;font-size:14px;margin-bottom:0">${reg ? 'Already have an account?' : 'New here?'} <a href="#" id="sw" style="color:var(--accent)">${reg ? 'Sign in' : 'Create account'}</a></p>
  </div>`;
  $('#sw').onclick = e => { e.preventDefault(); loginView(reg ? 'login' : 'register'); };
  $('#showpw').onchange = e => $('#pw').type = e.target.checked ? 'text' : 'password';
  const go = async () => {
    try {
      const body = { username: $('#user').value, password: $('#pw').value };
      if (reg) { body.name = $('#name').value; if ($('#code')) body.code = $('#code').value; if ($('#lobbyName')) body.lobbyName = $('#lobbyName').value; }
      const r = await api('POST', reg ? '/api/register' : '/api/login', body);
      token = r.token; me = r.user; localStorage.setItem('token', token); route();
    } catch (e) { setErr(e.message); }
  };
  $('#go').onclick = go;
  $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  (reg ? $('#name') : $('#user')).focus();
}

// ---------- chart: cumulative profit/loss by night ----------
function chartSVG(history) {
  if (!history.length) return '<p class="mute" style="text-align:center">Your chart appears after your first game.</p>';
  const W = 640, H = 230, L = 52, R = 14, T = 14, B = 28;
  const pts = [{ date: null, v: 0 }, ...history.map(h => ({ date: h.date, v: h.cumulative, net: h.net }))];
  let lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(0, ...pts.map(p => p.v));
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const last = pts[pts.length - 1].v, col = last >= 0 ? 'var(--win)' : 'var(--loss)';
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const ticks = [lo + pad, 0, hi - pad].filter((v, i, a) => a.indexOf(v) === i);
  const step = Math.ceil(pts.length / 6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative profit and loss by game night">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? '#4d6b5b' : '#254033'}" ${t === 0 ? '' : 'stroke-dasharray="3 4"'}/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${money(Math.round(t))}</text>`).join('')}
    <path d="${area}" fill="${col}" opacity=".13"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => i ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="${col}" stroke="#17261d" stroke-width="2"><title>${fmtDate(p.date)}: ${p.net > 0 ? '+' : ''}${money(p.net)} (total ${money(p.v)})</title></circle>` : '').join('')}
    ${pts.map((p, i) => i && (i - 1) % step === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${new Date(p.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>` : '').join('')}
  </svg>`;
}

// ---------- bar chart: result of each night ----------
function barsSVG(history) {
  if (!history.length) return '';
  const W = 640, H = 170, L = 52, R = 14, T = 12, B = 26;
  const vals = history.map(h => h.net);
  let hi = Math.max(0, ...vals), lo = Math.min(0, ...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const slot = (W - L - R) / history.length, bw = Math.min(46, slot * 0.66);
  const step = Math.ceil(history.length / 7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Result of each night">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#4d6b5b"/>
    <text x="${L - 8}" y="${y(hi) + 4}" text-anchor="end">${money(Math.round(hi))}</text><text x="${L - 8}" y="${y(lo) + 4}" text-anchor="end">${money(Math.round(lo))}</text>
    ${history.map((h, i) => { const x = L + slot * i + (slot - bw) / 2, y0 = y(0), y1 = y(h.net);
      return `<rect x="${x.toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, Math.abs(y1 - y0)).toFixed(1)}" rx="3" fill="${h.net >= 0 ? 'var(--win)' : 'var(--loss)'}" opacity=".9"><title>${fmtDate(h.date)}: ${h.net > 0 ? '+' : ''}${money(h.net)}</title></rect>`
        + (i % step === 0 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${new Date(h.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>` : ''); }).join('')}
  </svg>`;
}


// ---------- settle-up: who owes whom ----------
function oweRow(t, sup) {
  const meIn = t.from === D.user.id || t.to === D.user.id;
  const who = t.from === D.user.id ? '<b>You</b>' : esc(t.fromName), whom = t.to === D.user.id ? '<b>you</b>' : esc(t.toName);
  return `<div class="owe ${meIn ? 'me' : ''}"><div class="names">${who} <span class="arrow">owes</span> ${whom}</div><span class="amt">${money(t.amount)}</span>
    ${sup ? `<button class="ghost sm" onclick="markPaid('${t.from}','${t.to}',${t.amount})">Mark paid</button>` : ''}</div>`;
}
function oweSummary() {
  const mine = D.owe.settlements, owes = mine.filter(t => t.from === D.user.id).reduce((a, t) => a + t.amount, 0), owed = mine.filter(t => t.to === D.user.id).reduce((a, t) => a + t.amount, 0);
  if (owes > 0 && owed > 0) return `<div class="summary">You owe <span class="loss">${money(owes)}</span> and you're owed <span class="win">${money(owed)}</span>.</div>`;
  if (owes > 0) return `<div class="summary">You owe <span class="loss">${money(owes)}</span> in total.</div>`;
  if (owed > 0) return `<div class="summary">You're owed <span class="win">${money(owed)}</span> in total.</div>`;
  return D.highlights.games ? `<div class="summary win">✓ You're all square. Nobody owes you and you owe nobody.</div>` : '';
}
function oweCard(full) {
  const O = D.owe, sup = D.isSuper, list = full ? O.settlements : O.settlements.filter(t => t.from === D.user.id || t.to === D.user.id);
  return `<div class="card"><h2>💸 ${full ? 'Who owes whom' : 'Your settle-up'}</h2>
    <div class="mute" style="font-size:13px;margin:-6px 0 12px">The fewest payments that square everyone up, based on every recorded night${O.payments.length ? ' and the payments already made' : ''}.</div>
    ${oweSummary()}
    ${list.length ? list.map(t => oweRow(t, sup)).join('') : `<p class="mute">${D.highlights.games ? (full ? 'Everyone is settled up. 🎉' : 'Nothing to settle.') : 'Nothing to settle yet. Balances appear after the first recorded night.'}</p>`}
    ${Math.abs(O.unaccounted) > 0.009 ? `<div class="warn">Recorded cash-outs and buy-ins differ by ${money(Math.abs(O.unaccounted))}, so some money isn't accounted for in the games.</div>` : ''}
    ${full && O.payments.length ? `<details style="margin-top:10px"><summary class="mute">Recent payments (${O.payments.length})</summary>
      ${O.payments.map(p => `<div class="owe" style="margin:6px 0"><div class="names">${esc(p.fromName)} <span class="arrow">paid</span> ${esc(p.toName)} <span class="mute">· ${fmtDate(p.date)}</span></div><span class="amt">${money(p.amount)}</span>
        ${sup ? `<button class="ghost sm" onclick="undoPayment('${p.id}')">Undo</button>` : ''}</div>`).join('')}</details>` : ''}</div>`;
}
async function markPaid(from, to, amount) {
  const v = prompt('Amount that was paid:', amount);
  if (v === null) return;
  const n = Number(v);
  if (!(n > 0)) return alert('Enter an amount greater than 0');
  try { await api('POST', '/api/payments', { from, to, amount: n }); route(); } catch (e) { alert(e.message); }
}
async function undoPayment(id) { if (confirm('Undo this payment?')) { await api('DELETE', '/api/payments/' + id); route(); } }

// ---------- HOME: events, leaderboard, lobby highlights ----------
function podiumHTML(st) {
  const top = st.slice(0, 3); if (!top.length) return '';
  const medal = ['🥇', '🥈', '🥉'];
  const order = top.length === 1 ? [0] : top.length === 2 ? [1, 0] : [1, 0, 2];
  return `<div class="podium">${order.map(i => { const p = top[i]; return `<div class="pod p${i + 1}"><div class="who">${esc(p.name)}${p.id === D.user.id ? ' <span class="mute">(you)</span>' : ''}</div><div class="amt">${signed(p.net)}</div><div class="base">${medal[i]}</div></div>`; }).join('')}</div>`;
}
function homePage() {
  const H = D.highlights, st = D.standings;
  app.innerHTML = `
    <div id="eventsBox">${eventsHTML()}</div>

    <div class="card"><h2>🏆 Leaderboard</h2>
      ${st.length ? podiumHTML(st) : ''}
      <table><tr><th>#</th><th>Player</th><th>Nights</th><th>Win rate</th><th>Net</th></tr>
      ${st.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.name)}${p.id === D.user.id ? ' <span class="mute">(you)</span>' : ''}</td><td>${p.games}</td><td>${p.games ? Math.round(100 * p.wins / p.games) + '%' : '—'}</td><td><b>${signed(p.net)}</b></td></tr>`).join('')}</table></div>

    ${oweCard(true)}

    <div class="card"><h2>📊 The lobby so far</h2>
      <div class="grid">
        <div class="stat"><small>Nights played</small><b>${H.games}</b></div>
        <div class="stat"><small>Total money played</small><b>${money(H.pot)}</b></div>
        <div class="stat"><small>Biggest night won</small><b>${H.biggestWin ? signed(H.biggestWin.amount) : '—'}</b><small>${H.biggestWin ? esc(H.biggestWin.name) + ' · ' + fmtDate(H.biggestWin.date) : ''}</small></div>
        <div class="stat"><small>Toughest night</small><b>${H.biggestLoss ? signed(H.biggestLoss.amount) : '—'}</b><small>${H.biggestLoss ? esc(H.biggestLoss.name) + ' · ' + fmtDate(H.biggestLoss.date) : ''}</small></div></div></div>

    <div class="card"><h2>🕒 Recent nights</h2>
      ${H.recent.length ? `<table><tr><th>Date</th><th>Players</th><th>Pot</th><th>Night's winner</th></tr>
        ${H.recent.map(r => `<tr><td>${fmtDate(r.date)}${r.note ? `<div class="mute" style="font-size:12px">${esc(r.note)}</div>` : ''}</td><td>${r.players}</td><td>${money(r.pot)}</td><td>${r.winner ? `${esc(r.winner.name)} ${signed(r.winner.net)}` : '—'}</td></tr>`).join('')}</table>` : '<p class="mute">No games recorded yet.</p>'}</div>`;
}

// ---------- PORTFOLIO: personal stats ----------
function portfolioPage() {
  const m = D.me, hist = m.history, n = hist.length;
  const rank = D.standings.findIndex(p => p.id === D.user.id) + 1;
  const wins = hist.filter(h => h.net > 0), losses = hist.filter(h => h.net < 0);
  const winRate = n ? Math.round(100 * wins.length / n) : 0;
  const roi = m.buyIn ? (100 * m.net / m.buyIn) : 0;
  const avg = n ? m.net / n : 0;
  const avgWin = wins.length ? wins.reduce((a, h) => a + h.net, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a, h) => a + h.net, 0) / losses.length : 0;
  // streaks
  let longestWin = 0, run = 0;
  hist.forEach(h => { run = h.net > 0 ? run + 1 : 0; longestWin = Math.max(longestWin, run); });
  let cur = 0, curSign = 0;
  for (let i = n - 1; i >= 0; i--) { const sg = Math.sign(hist[i].net); if (i === n - 1) { curSign = sg; cur = 1; if (!sg) break; } else if (sg === curSign) cur++; else break; }
  const bestN = n ? hist.reduce((a, h) => h.net > a.net ? h : a) : null, worstN = n ? hist.reduce((a, h) => h.net < a.net ? h : a) : null;
  const form = hist.slice(-5);
  // by month
  const months = {};
  hist.forEach(h => { const k = h.date.slice(0, 7); (months[k] = months[k] || { n: 0, net: 0 }); months[k].n++; months[k].net += h.net; });
  const monthRows = Object.entries(months).sort((a, b) => b[0].localeCompare(a[0]));
  const maxAbs = Math.max(1, ...hist.map(h => Math.abs(h.net)));
  const badges = [
    { ic: '👑', t: 'Lobby leader', d: 'Currently #1 on the leaderboard', on: rank === 1 && n > 0 },
    { ic: '🔥', t: 'On fire', d: 'Won your last 2+ nights in a row', on: curSign > 0 && cur >= 2 },
    { ic: '🎯', t: 'Consistent', d: '60%+ win rate over 5+ nights', on: n >= 5 && winRate >= 60 },
    { ic: '💎', t: 'Big night', d: 'Won $500+ in a single night', on: !!bestN && bestN.net >= 500 },
    { ic: '🛡️', t: 'Veteran', d: 'Played 10 or more nights', on: n >= 10 },
    { ic: '📈', t: 'In the green', d: 'Overall profit across all nights', on: m.net > 0 },
  ];
  const insights = [];
  if (n) {
    insights.push(`You win <b>${winRate}%</b> of your nights (${wins.length} won, ${losses.length} lost${n - wins.length - losses.length ? `, ${n - wins.length - losses.length} even` : ''}).`);
    if (wins.length && losses.length) insights.push(`When you win you average <b class="win">+${money(avgWin)}</b>; when you lose, <b class="loss">${money(avgLoss)}</b>.`);
    insights.push(`On average you put in <b>${money(m.buyIn / n)}</b> a night and walk away with <b>${money(m.cashOut / n)}</b>.`);
    if (curSign !== 0) insights.push(`Current streak: <b class="${curSign > 0 ? 'win' : 'loss'}">${cur} ${curSign > 0 ? 'win' : 'loss'}${cur === 1 ? '' : (curSign > 0 ? 's' : 'es')}</b> in a row. Longest win streak: <b>${longestWin}</b>.`);
  }
  const mine = D.events.filter(e => e.joined);
  app.innerHTML = `
    <div class="card"><div class="row" style="gap:16px;flex-wrap:nowrap">
      <div class="avatar">${esc((D.user.name || '?').trim()[0].toUpperCase())}</div>
      <div><div style="font-size:20px;font-weight:700">${esc(D.user.name)}</div>
        <div class="mute">${n ? `Rank <b style="color:var(--text)">#${rank}</b> of ${D.standings.length} in ${esc(D.lobby.name)}` : esc(D.lobby.name)}</div></div></div>
      <div class="hero" style="margin-top:6px"><small>Overall earnings</small><div class="big">${signed(m.net)}</div>
        <small>${n ? `${n} night${n === 1 ? '' : 's'} · ${roi >= 0 ? '+' : ''}${roi.toFixed(1)}% return on money put in` : 'No games played yet'}</small></div>
      ${n ? `<div style="margin-top:12px"><div class="mute" style="font-size:12px;margin-bottom:6px">LAST ${form.length} NIGHT${form.length === 1 ? '' : 'S'}</div><div class="formdots">${form.map(h => `<span class="fd ${h.net > 0 ? 'w' : h.net < 0 ? 'l' : 'p'}" title="${fmtDate(h.date)}">${h.net > 0 ? '+' : ''}${money(h.net)}</span>`).join('')}</div></div>` : ''}</div>

    ${mine.length ? `<div class="card"><h2>📅 You're in</h2>${mine.map(e => `<div class="ev" style="margin:0 0 8px"><b>${esc(e.title)}</b> ${e.status === 'live' ? '<span class="loss"><span class="dot"></span>live now</span>' : ''}<div class="mute">${evWhen(e)}${e.location ? ' · ' + esc(e.location) : ''} · your buy-in ${money(e.players.find(p => p.userId === D.user.id).total)}</div></div>`).join('')}</div>` : ''}

    ${oweCard(false)}

    <div class="card"><h2>📈 Bankroll over time</h2><div class="mute" style="font-size:13px">Running total of your wins and losses</div>${chartSVG(hist)}</div>
    ${n ? `<div class="card"><h2>📊 Night by night</h2>${barsSVG(hist)}</div>` : ''}

    <div class="card"><h2>🧮 Your numbers</h2><div class="grid">
      <div class="stat"><small>Win rate</small><b>${n ? winRate + '%' : '—'}</b></div>
      <div class="stat"><small>Avg per night</small><b>${n ? signed(avg) : '—'}</b></div>
      <div class="stat"><small>Total put in</small><b>${money(m.buyIn)}</b></div>
      <div class="stat"><small>Total cashed out</small><b>${money(m.cashOut)}</b></div>
      <div class="stat"><small>Best night</small><b>${bestN ? signed(bestN.net) : '—'}</b><small>${bestN ? fmtDate(bestN.date) : ''}</small></div>
      <div class="stat"><small>Worst night</small><b>${worstN ? signed(worstN.net) : '—'}</b><small>${worstN ? fmtDate(worstN.date) : ''}</small></div>
      <div class="stat"><small>Longest win streak</small><b>${n ? longestWin : '—'}</b></div>
      <div class="stat"><small>Return on money in</small><b>${n ? `<span class="${roi >= 0 ? 'win' : 'loss'}">${roi >= 0 ? '+' : ''}${roi.toFixed(1)}%</span>` : '—'}</b></div></div>
      ${insights.length ? `<div style="margin-top:14px">${insights.map(t => `<div class="insight">${t}</div>`).join('')}</div>` : ''}</div>

    <div class="card"><h2>🏅 Badges</h2><div class="badges">${badges.map(b => `<div class="badge ${b.on ? 'on' : 'off'}"><span class="ic">${b.ic}</span><div><b>${b.t}</b><small>${b.d}</small></div></div>`).join('')}</div></div>

    ${monthRows.length ? `<div class="card"><h2>🗓️ By month</h2><table><tr><th>Month</th><th>Nights</th><th>Result</th></tr>
      ${monthRows.map(([k, v]) => `<tr><td>${new Date(k + '-01T12:00:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</td><td>${v.n}</td><td><b>${signed(v.net)}</b></td></tr>`).join('')}</table></div>` : ''}

    <div class="card"><h2>🗒️ Every night you played</h2>
      ${n ? `<table><tr><th>Date</th><th>In</th><th>Out</th><th></th><th>Won / lost</th></tr>
        ${[...hist].reverse().map(h => `<tr><td>${fmtDate(h.date)}${h.note ? `<div class="mute" style="font-size:12px">${esc(h.note)}</div>` : ''}</td><td>${money(h.buyIn)}</td><td>${money(h.cashOut)}</td>
          <td style="width:90px"><div class="bar"><i style="width:${Math.round(100 * Math.abs(h.net) / maxAbs)}%;background:${h.net >= 0 ? 'var(--win)' : 'var(--loss)'}"></i></div></td><td><b>${signed(h.net)}</b></td></tr>`).join('')}</table>`
        : '<p class="mute">Nothing yet. Your nights will appear here after the super user records a game you played in.</p>'}</div>`;
}

// ---------- MANAGE (super user) ----------
function managePage() {
  const nameOf = id => (D.members.find(x => x.id === id) || {}).name || 'Removed player';
  app.innerHTML = `
    <div class="card"><div class="row" style="justify-content:space-between"><b>Invite players</b>
      <div class="row"><span class="mute">Lobby code</span><span class="code">${D.lobby.code}</span><button class="ghost sm" id="cp">Copy code</button><button class="sm" id="sh">Share</button></div></div>
      <p class="mute" style="margin:10px 0 0;font-size:13px">Friends open this app, tap “Create account” and enter the code.</p>
      <div class="row" style="margin-top:12px">${D.members.map(x => `<span class="stat" style="padding:6px 10px">${esc(x.name)} <span class="mute">@${esc(x.username)}</span>${x.id !== D.lobby.hostId ? ` <a href="#" onclick="rmMember('${x.id}');return false" class="loss">✕</a>` : ''}</span>`).join('')}</div></div>

    <div class="card"><h2>Schedule an event</h2>
      <div class="row"><input id="etitle" placeholder="Title (e.g. Friday Night Game)"><input id="eloc" placeholder="Location"></div>
      <div class="row" style="margin-top:8px"><input type="date" id="edate" value="${new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10)}"><input type="time" id="etime" value="20:00">
        <input type="number" id="emin" min="0" step="any" placeholder="Min buy-in ($)"><input type="number" id="eseats" min="2" placeholder="Max seats (optional)"></div>
      <div class="row" style="margin-top:10px"><button id="ecreate">Create event</button></div><p class="err" id="eerr"></p></div>

    <div class="card"><h2 id="formTitle">Record a poker night</h2><div id="sform"></div></div>

    <div class="card"><h2>All games</h2>
      ${D.sessions.length ? D.sessions.map(s => `<details><summary><b>${fmtDate(s.date)}</b> ${s.note ? '— ' + esc(s.note) : ''} <span class="mute">· pot ${money(s.totalIn)}</span></summary>
        <table><tr><th>Player</th><th>Start</th><th>End</th><th>Net</th></tr>
        ${s.entries.map(e => `<tr><td>${esc(nameOf(e.userId))}</td><td>${money(e.buyIn)}</td><td>${money(e.cashOut)}</td><td>${signed(e.cashOut - e.buyIn)}</td></tr>`).join('')}</table>
        ${Math.abs(s.totalIn - s.totalOut) > 0.001 ? `<div class="warn">In/out differ by ${money(s.totalIn - s.totalOut)}</div>` : ''}
        <div class="row" style="margin-top:8px"><button class="ghost sm" onclick="editSession('${s.id}')">Edit</button><button class="danger sm" onclick="delSession('${s.id}')">Delete</button></div></details>`).join('') : '<p class="mute">No games recorded yet.</p>'}</div>

    <div class="card"><h2>Backup</h2><p class="mute" style="margin-top:0;font-size:13px">Download all players and games as a file. Keep it private (it holds password hashes). You can restore it here later.</p>
      <div class="row"><button class="ghost" id="bk">Download backup</button><label class="ghost" style="cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 14px">Restore from file<input type="file" id="rs" accept=".json" hidden></label></div><p class="err" id="err3"></p></div>`;

  const msg = `Join my poker lobby "${D.lobby.name}" — code: ${D.lobby.code}\n${location.origin}`;
  $('#cp').onclick = () => { navigator.clipboard?.writeText(D.lobby.code); $('#cp').textContent = 'Copied ✓'; };
  $('#sh').onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title: D.lobby.name, text: msg }); } catch {} }
    else { navigator.clipboard?.writeText(msg); $('#sh').textContent = 'Message copied ✓'; }
  };
  $('#bk').onclick = async () => {
    const data = await api('GET', '/api/backup');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `poker-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  };
  $('#rs').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm('Replace ALL current data with this backup?')) return;
    try { await api('POST', '/api/restore', JSON.parse(await f.text())); dashboard(); } catch (x) { $('#err3').textContent = x.message; }
  };
  $('#ecreate').onclick = async () => {
    try {
      await api('POST', '/api/events', { title: $('#etitle').value, location: $('#eloc').value, date: $('#edate').value, time: $('#etime').value, minBuyIn: $('#emin').value || 0, maxSeats: $('#eseats').value });
      location.hash = '#/';
    } catch (e) { $('#eerr').textContent = e.message; }

  sessionForm(null);
}

function sessionForm(s) {
  const rows = D.members.map(m => {
    const e = s ? s.entries.find(x => x.userId === m.id) : null;
    return `<tr data-u="${m.id}"><td><input type="checkbox" class="pl" ${!s || e ? 'checked' : ''}> ${esc(m.name)}</td>
      <td><input type="number" min="0" step="any" class="bi" value="${e ? e.buyIn : ''}" placeholder="0"></td>
      <td><input type="number" min="0" step="any" class="co" value="${e ? e.cashOut : ''}" placeholder="0"></td><td class="net">—</td></tr>`;
  }).join('');
  $('#formTitle').textContent = s ? 'Edit game' : 'Record a poker night';
  $('#sform').innerHTML = `
    <div class="row" style="margin-bottom:10px"><input type="date" id="sdate" value="${s ? s.date : new Date().toISOString().slice(0, 10)}" style="max-width:170px"><input id="snote" placeholder="Note (optional)" value="${s ? esc(s.note) : ''}"></div>
    <table><tr><th>Player</th><th>Start (in)</th><th>End (out)</th><th>Net</th></tr>${rows}
      <tr><td><b>Total</b></td><td id="tin">—</td><td id="tout">—</td><td id="tnet">—</td></tr></table>
    <div id="chk"></div>
    <div class="row" style="margin-top:12px"><button id="ssave">${s ? 'Save changes' : 'Save game'}</button>${s ? '<button class="ghost" id="scancel">Cancel</button>' : ''}</div><p class="err" id="err"></p>`;
  const calc = () => {
    let ti = 0, to = 0;
    document.querySelectorAll('#sform tr[data-u]').forEach(tr => {
      const on = tr.querySelector('.pl').checked;
      const bi = +tr.querySelector('.bi').value || 0, co = +tr.querySelector('.co').value || 0;
      tr.querySelector('.net').innerHTML = on ? signed(co - bi) : '—';
      if (on) { ti += bi; to += co; }
    });
    $('#tin').textContent = money(ti); $('#tout').textContent = money(to); $('#tnet').innerHTML = signed(to - ti);
    $('#chk').innerHTML = Math.abs(ti - to) > 0.001 ? `<div class="warn">Total in and out differ by ${money(Math.abs(ti - to))} — ${to > ti ? 'cash-outs exceed buy-ins' : 'some chips unaccounted for'}.</div>` : (ti ? '<div class="win" style="margin-top:8px">✓ Balanced</div>' : '');
  };
  $('#sform').oninput = calc; $('#sform').onchange = calc; calc();
  if (s) $('#scancel').onclick = () => sessionForm(null);
  $('#ssave').onclick = async () => {
    const entries = [...document.querySelectorAll('#sform tr[data-u]')].filter(tr => tr.querySelector('.pl').checked)
      .map(tr => ({ userId: tr.dataset.u, buyIn: +tr.querySelector('.bi').value || 0, cashOut: +tr.querySelector('.co').value || 0 }));
    if (!entries.length) return setErr('Select at least one player');
    try {
      const body = { date: $('#sdate').value, note: $('#snote').value, entries };
      if (s) await api('PUT', '/api/sessions/' + s.id, body); else await api('POST', '/api/sessions', body);
      dashboard();
    } catch (e) { setErr(e.message); }
  };
}
function editSession(sid) { sessionForm(D.sessions.find(x => x.id === sid)); $('#formTitle').scrollIntoView({ behavior: 'smooth' }); }
async function delSession(sid) { if (confirm('Delete this game?')) { await api('DELETE', '/api/sessions/' + sid); dashboard(); } }
async function rmMember(u) { if (confirm('Remove this player? Their past games stop counting.')) { await api('DELETE', '/api/members/' + u); dashboard(); } }

// ---------- events: upcoming + live session ----------
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const evWhen = e => fmtDate(e.date) + (e.time ? ' · ' + fmtTime(e.time) : '');

function joinBox(e) {
  if (e.joined) {
    const mine = e.players.find(p => p.userId === D.user.id);
    return `<p style="margin:10px 0 0"><span class="win">✓ You're in</span> with ${money(mine.total)}
      ${e.status === 'upcoming' ? `<button class="ghost sm" onclick="leaveEvent('${e.id}')" style="margin-left:8px">Leave</button>` : ''}</p>`;
  }
  if (e.seatsLeft === 0) return '<p class="mute" style="margin:10px 0 0">No seats left.</p>';
  return `<div style="margin-top:10px"><div class="row"><input type="number" id="jb-${e.id}" min="${e.minBuyIn}" step="any" value="${e.minBuyIn || ''}" placeholder="Your buy-in" style="max-width:160px;flex:0 1 160px">
      <button onclick="joinEvent('${e.id}')">${e.status === 'live' ? 'Join late' : 'Join'}</button></div>
    <div class="mute" style="font-size:12px;margin-top:4px">${e.minBuyIn ? `Minimum buy-in ${money(e.minBuyIn)}. You can't join below it.` : 'No minimum buy-in.'}</div><p class="err" id="je-${e.id}"></p></div>`;
}

function eventHTML(e, sup) {
  const live = e.status === 'live';
  const chips = e.players.map(p => `<span class="chip">${esc(p.name)} <span class="mute">${money(p.total)}</span>${sup ? ` <a href="#" class="loss" onclick="removePlayer('${e.id}','${p.userId}');return false">✕</a>` : ''}</span>`).join('') || '<span class="mute">Nobody yet. Be the first.</span>';
  const head = live
    ? `<div class="row" style="justify-content:space-between"><h2 style="margin:0"><span class="dot"></span>Session in progress</h2><span class="pill">started ${new Date(e.startedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span></div><h3 style="margin:8px 0 0;font-size:16px;color:var(--text)">${esc(e.title)}${e.location ? ` <span class="mute">· ${esc(e.location)}</span>` : ''}</h3>`
    : `<div class="row" style="justify-content:space-between"><div><span class="tag">UPCOMING</span><h3 style="margin-top:2px">${esc(e.title)}</h3><div class="mute">${evWhen(e)}${e.location ? ' · ' + esc(e.location) : ''}</div></div>
        <div style="text-align:right"><div class="stat" style="padding:8px 12px"><small>Min buy-in</small><b style="font-size:18px">${e.minBuyIn ? money(e.minBuyIn) : 'None'}</b></div></div></div>`;
  const stats = live
    ? `<div class="grid" style="margin-top:12px"><div class="stat"><small>Pot</small><b>${money(e.pot)}</b></div><div class="stat"><small>Players</small><b>${e.players.length}</b></div><div class="stat"><small>Min buy-in</small><b>${e.minBuyIn ? money(e.minBuyIn) : 'None'}</b></div></div>` : '';
  const table = live ? `<table style="margin-top:12px"><tr><th>Player</th><th>Buy-in</th><th>Rebuys</th><th>Total</th>${sup ? '<th></th>' : ''}</tr>
      ${e.players.map(p => `<tr><td>${esc(p.name)}${p.userId === D.user.id ? ' <span class="mute">(you)</span>' : ''}</td><td>${money(p.buyIn)}</td><td>${p.rebuys ? money(p.rebuys) : '—'}</td><td><b>${money(p.total)}</b></td>
        ${sup ? `<td style="white-space:nowrap"><input type="number" id="rb-${e.id}-${p.userId}" min="1" placeholder="Rebuy $" style="width:84px;padding:4px"> <button class="ghost sm" onclick="rebuy('${e.id}','${p.userId}')">+</button> <a href="#" class="loss" onclick="removePlayer('${e.id}','${p.userId}');return false">✕</a></td>` : ''}</tr>`).join('')}</table>`
    : `<div class="chips">${chips}</div><div class="mute" style="font-size:13px">${e.players.length} joined${e.seatsLeft !== null ? ` · ${e.seatsLeft} seat${e.seatsLeft === 1 ? '' : 's'} left` : ''}</div>`;
  const supBtns = sup ? `<div class="row" style="margin-top:12px">${live
    ? `<button onclick="openSettle('${e.id}')">End session &amp; enter cash-outs</button>`
    : `<button onclick="startEvent('${e.id}')">Start session</button><button class="danger sm" onclick="cancelEvent('${e.id}')">Cancel event</button>`}</div><p class="err" id="se-${e.id}"></p><div id="settle-${e.id}"></div>` : '';
  return `<div class="card ${live ? 'live' : ''}">${head}${stats}${table}${joinBox(e)}${supBtns}</div>`;
}
function eventsHTML() {
  const evs = (D && D.events) || [];
  if (!evs.length) return `<div class="card empty"><div style="font-size:30px">🃏</div><b style="color:var(--text)">No game scheduled yet</b><div style="font-size:14px;margin-top:4px">${D.isSuper ? 'Plan the next night from <a href="#/manage" style="color:var(--accent)">Manage</a>.' : 'When the super user schedules a game, it will show up here so you can join.'}</div></div>`;
  return evs.map(e => eventHTML(e, D.isSuper)).join('');
}
const refreshEvents = async (full) => { if (full) return dashboard(); D = await api('GET', '/api/home'); $('#eventsBox').innerHTML = eventsHTML(); };

async function joinEvent(id) {
  const v = +$('#jb-' + id).value, e = D.events.find(x => x.id === id);
  if (!(v > 0)) return $('#je-' + id).textContent = 'Enter your buy-in amount';
  if (v < e.minBuyIn) return $('#je-' + id).textContent = `Minimum buy-in is ${money(e.minBuyIn)}`;
  try { await api('POST', `/api/events/${id}/join`, { buyIn: v }); refreshEvents(); } catch (x) { $('#je-' + id).textContent = x.message; }
}
async function leaveEvent(id) { try { await api('DELETE', `/api/events/${id}/join`); refreshEvents(); } catch (x) { alert(x.message); } }
async function startEvent(id) {
  try { await api('POST', `/api/events/${id}/start`); refreshEvents(); } catch (x) { $('#se-' + id).textContent = x.message; }
}
async function cancelEvent(id) { if (confirm('Cancel this event?')) { await api('DELETE', '/api/events/' + id); refreshEvents(); } }
async function removePlayer(id, u) { if (confirm('Remove this player from the event?')) { await api('DELETE', `/api/events/${id}/players/${u}`); refreshEvents(); } }
async function rebuy(id, u) {
  const amt = +$(`#rb-${id}-${u}`).value;
  try { await api('POST', `/api/events/${id}/rebuy`, { userId: u, amount: amt }); refreshEvents(); } catch (x) { $('#se-' + id).textContent = x.message; }
}
function openSettle(id) {
  const e = D.events.find(x => x.id === id), box = $('#settle-' + id);
  box.innerHTML = `<div class="warn" style="margin-top:12px"><b>End session</b> — enter what each player cashed out with.</div>
    <table><tr><th>Player</th><th>Total in</th><th>Cash-out</th><th>Net</th></tr>
    ${e.players.map(p => `<tr data-u="${p.userId}" data-in="${p.total}"><td>${esc(p.name)}</td><td>${money(p.total)}</td><td><input type="number" min="0" step="any" class="co" placeholder="0"></td><td class="net">—</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td>${money(e.pot)}</td><td id="so-${id}">—</td><td></td></tr></table><div id="sc-${id}"></div>
    <div class="row" style="margin-top:10px"><button id="sf-${id}">Save &amp; end session</button><button class="ghost" onclick="$('#settle-${id}').innerHTML=''">Cancel</button></div>`;
  const calc = () => {
    let out = 0;
    box.querySelectorAll('tr[data-u]').forEach(tr => { const c = +tr.querySelector('.co').value || 0; out += c; tr.querySelector('.net').innerHTML = signed(c - +tr.dataset.in); });
    $('#so-' + id).textContent = money(out);
    $('#sc-' + id).innerHTML = Math.abs(out - e.pot) > 0.001 ? `<div class="warn">Cash-outs differ from the pot by ${money(Math.abs(out - e.pot))}.</div>` : '<div class="win" style="margin-top:8px">✓ Balanced</div>';
  };
  box.oninput = calc; calc();
  $('#sf-' + id).onclick = async () => {
    const cashOuts = {}; box.querySelectorAll('tr[data-u]').forEach(tr => cashOuts[tr.dataset.u] = +tr.querySelector('.co').value || 0);
    try { await api('POST', `/api/events/${id}/finish`, { cashOuts }); dashboard(); } catch (x) { $('#se-' + id).textContent = x.message; }
  };
}

// keep the live session fresh for everyone without disturbing forms
setInterval(async () => {
  if (!token || !me || !D) return;
  const box = $('#eventsBox'); if (!box) return;
  const a = document.activeElement;
  if (box.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
  if (box.querySelector('[id^="settle-"] table')) return;
  try {
    const nd = await api('GET', '/api/home');
    const sig = x => JSON.stringify(x.events);
    if (sig(nd) === sig(D)) return;
    const hadLive = D.events.some(e => e.status === 'live'), hasLive = nd.events.some(e => e.status === 'live');
    D = nd;
    if (hadLive && !hasLive) return dashboard();
    box.innerHTML = eventsHTML();
  } catch {}
}, 15000);

route();
</script>
